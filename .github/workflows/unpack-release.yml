# Put this file in your repo at: .github/workflows/unpack-release.yml
# Then upload mzansi-pathways-v78-site.zip to the repo root and rename it to release.zip.
# GitHub unpacks it into the right folders, deletes the zip, and Cloudflare redeploys by itself.
name: Unpack release.zip
on:
  push:
    paths: ['release.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          rm -rf /tmp/rel && mkdir /tmp/rel && unzip -q release.zip -d /tmp/rel -x '__MACOSX/*'
          # if the zip wraps everything in one folder, step into it
          if [ "$(ls -A /tmp/rel | wc -l)" = "1" ] && [ -d "/tmp/rel/$(ls /tmp/rel)" ]; then cd "/tmp/rel/$(ls /tmp/rel)"; else cd /tmp/rel; fi
          test -f index.html || { echo "index.html not found in zip"; exit 1; }
          cp -a . "$GITHUB_WORKSPACE/"
      - name: Commit
        run: |
          rm -f release.zip
          git config user.name "release-bot"; git config user.email "release-bot@users.noreply.github.com"
          git add -A; git commit -m "Unpack release.zip" || exit 0; git push
