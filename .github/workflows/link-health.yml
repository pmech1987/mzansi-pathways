name: Link health

# Every Monday 06:00 South African time (04:00 UTC) and on demand. Checks every official link and records the result.
# It only reports (data/link_health.json). It never edits a fact or removes a link.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mz-data-writes
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Back up the data (kept 30 days, outside git)
        run: python3 scripts/backup_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check links
        run: python scripts/check_links.py | tee links.log
      - name: Checks (nothing is committed if these fail)
        run: |
          python scripts/test_scripts.py
          python scripts/test_automation.py
          python scripts/test_hardening.py
          python scripts/validate_data.py
          node tests/run.mjs
      - name: Summary
        if: always()
        run: |
          { echo '### Link health'; echo '```'; cat links.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          scripts/push_data.sh "data: link health $(date -u +%F)" data
      - name: Tell a person if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_status.sh fail "Link health"
      - name: Close the failure issue if we recovered
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_status.sh ok "Link health"
