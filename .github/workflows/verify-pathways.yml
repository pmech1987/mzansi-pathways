name: Mzansi Pathways — 68-Gate Security, Auth & Integrity Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # weekly: surfaces records about to go stale

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all verification, auth, failsafe & governance gates (seals checked when reviewer secrets exist)
        env:
          MZ_REVIEWER_SECRETS: ${{ secrets.MZ_REVIEWER_SECRETS }}
          MZ_REQUIRE_SIGS: ${{ secrets.MZ_REVIEWER_SECRETS != '' && '1' || '' }}
        run: python3 scripts/verify_release.py
      - name: Re-verification queue (what is expired or expiring)
        run: for f in data/programmes/*.json; do y=$(basename "$f" .json); echo "== $y"; python3 scripts/mz_verify.py queue "$y"; done
      - name: Independent Stage 4 cryptographic attestation check
        run: python3 scripts/verify_attestation_seal.py
      - name: Upload structured verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-report
          path: release_verification_report.json
          retention-days: 14
