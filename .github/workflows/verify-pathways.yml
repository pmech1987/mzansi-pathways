name: Mzansi Pathways — 68-Gate Security, Auth & Integrity Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all 68 verification, auth, failsafe & governance gates
        run: python3 scripts/verify_release.py
      - name: Independent Stage 4 cryptographic attestation check
        run: python3 scripts/verify_attestation_seal.py
      - name: Upload structured verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-report
          path: release_verification_report.json
          retention-days: 14
