name: Refresh Legal Open Jobs Feed (Zero Scraping)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-open-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh copyright-safe open jobs feed (Greenhouse ATS + Adzuna SA + Direct Submissions)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 scripts/fetch_legal_public_jobs.py
      - name: Upload refreshed open_jobs_live.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-jobs-live-feed
          path: data/open_jobs_live.json
          retention-days: 7
